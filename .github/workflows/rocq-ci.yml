name: Rocq 9.1 Formal Verification & Extraction CI

on:
  workflow_dispatch:
  push:
    tags:
      - "phase-*"
      - "toolchain-*"
      - "v*"
  pull_request:
    paths:
      - "vellvm/src/**"
      - "vellvm/rocq-vellvm.opam"
      - "passes/**"
      - "validator/**"
      - ".github/workflows/rocq-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DUNE_CACHE: enabled
  DUNE_CACHE_STORAGE_MODE: copy

jobs:
  rocq-verify:
    name: Build Vellvm Proofs & OCaml Extraction (Rocq 9.1)
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run static zero-Admitted & OCaml TCB gate first
        run: python3 scripts/verify_repo_integrity.py

      - name: Set up OCaml 4.14 base switch (without slow workspace rsync)
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "4.14.x"
          opam-pin: false
          opam-repositories: |
            rocq-released: https://rocq-prover.org/opam/released
            default: https://opam.ocaml.org

      - name: Restore compiled Rocq 9.1 & Vellvm opam dependencies
        id: opam-deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _opam
          key: rocq91-opam-${{ runner.os }}-4.14-${{ hashFiles('vellvm/rocq-vellvm.opam') }}

      - name: Install Rocq 9.1 & Vellvm dependencies (skipped on cache hit)
        run: |
          if [ ! -x "_opam/bin/rocq" ]; then
            opam install -y --deps-only ./vellvm/rocq-vellvm.opam -j$(nproc)
          fi

      - name: Cache Dune content-addressed build store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dune
          key: vellvm-dune-${{ runner.os }}-${{ hashFiles('vellvm/src/ml/**') }}
          restore-keys: |
            vellvm-dune-${{ runner.os }}-

      - name: Cache compiled Vellvm .vo proof objects (exact hash key to preserve make mtimes)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vellvm/src/rocq
            vellvm/src/ml/extracted
            passes
            validator
          key: vellvm-vo-${{ runner.os }}-${{ hashFiles('vellvm/rocq-vellvm.opam', 'vellvm/src/_RocqProject', 'vellvm/src/rocq/**/*.v', 'passes/**/*.v', 'validator/**/*.v', 'vellvm/src/ml/extracted/Extract.v') }}

      - name: Compile Rocq 9.1 theories, extract OCaml & build libvellvm
        run: opam exec -- make -C vellvm/src all -j$(nproc)

      - name: Independent Rocq kernel proof-checker gate (rocq check)
        run: cd vellvm/src && opam exec -- rocq check -o -R rocq Vellvm -R ../../passes CertPasses -R ../../validator CertValidator Vellvm.Semantics.TopLevel Vellvm.Theory.Equational CertPasses.Pipeline CertPasses.McfgExport CertPasses.ModuleMerge CertValidator.CertValidator CertValidator.CheckAssumptions

      - name: Layer-1 kernel Print Assumptions audit gate
        run: |
          OUT="$(cd vellvm/src && opam exec -- rocq top -q -R rocq Vellvm -R ../../passes CertPasses -R ../../validator CertValidator <<'EOF'
          Set Printing Width 10000.
          From CertPasses Require Pipeline ModuleMerge.
          From CertValidator Require AigLrat AlgRules CertValidator.
          Print Assumptions CertPasses.Pipeline.optimize_mcfg_I2F_model_refine.
          Print Assumptions CertPasses.ModuleMerge.validate_module_merge_parsed_I2F_model_refine.
          Print Assumptions CertPasses.ModuleMerge.validate_module_merge_tle_refines.
          Print Assumptions CertValidator.AigLrat.check_lrat_unsat_sound.
          Print Assumptions CertValidator.AlgRules.check_expr_refines_with_lrat_sound.
          Print Assumptions CertValidator.CertValidator.validate_tle_pair_with_cert_str_sound.
          EOF
          )"
          echo "$OUT"
          python3 - "$OUT" <<'PY'
          import sys
          out = sys.argv[1]
          allowed_markers = (
              "Axioms:",
              "Closed under the global context",
              "wordsize_not_zero",
              "Zlog2_log_inf",
          )
          for raw in out.splitlines():
              if not raw.strip() or raw.startswith(" "):
                  continue
              if not any(m in raw for m in allowed_markers):
                  print(f"Unapproved assumption in Print Assumptions output: {raw}", file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Smoke-test standalone verified-opt-fallback binary
        run: |
          BIN="vellvm/src/_build/default/ml/bin/verified-opt-fallback"
          test -x "$BIN"
          TMP_IN="$(mktemp /tmp/fallback-in-XXXXXX.ll)"
          TMP_OUT="$(mktemp /tmp/fallback-out-XXXXXX.ll)"
          cat > "$TMP_IN" <<'EOF'
          define i32 @smoke_add(i32 %x) {
          entry:
            %slot = alloca i32, align 4
            store i32 %x, ptr %slot, align 4
            %v = load i32, ptr %slot, align 4
            %dead = add i32 %v, 0
            %res = add i32 %v, 42
            ret i32 %res
          }
          EOF
          "$BIN" --pass pipeline -o "$TMP_OUT" "$TMP_IN"
          grep -q "define i32 @smoke_add" "$TMP_OUT"
          rm -f "$TMP_IN" "$TMP_OUT"

      - name: Layer-2 positive & adversarial forged-certificate gate on cert-validator
        run: |
          VBIN="vellvm/src/_build/default/ml/bin/cert-validator"
          test -x "$VBIN"
          WORKDIR="$(mktemp -d /tmp/cert-val-gate-XXXXXX)"
          trap 'rm -rf "$WORKDIR"' EXIT

          cat > "$WORKDIR/src.ll" <<'EOF'
          define i32 @smoke_fold(i32 %x) {
          entry:
            %t0 = add i32 %x, 0
            %res = add i32 %t0, 42
            ret i32 %res
          }
          EOF

          cat > "$WORKDIR/tgt_ok.ll" <<'EOF'
          define i32 @smoke_fold(i32 %x) {
          entry:
            %res = add i32 %x, 42
            ret i32 %res
          }
          EOF

          cat > "$WORKDIR/cert_ok.cert" <<'EOF'
          (cert-v1
            (fn "smoke_fold")
            (src-sha256 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef)
            (tgt-sha256 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef)
            (blocks
              (block
                (src-bb "entry")
                (tgt-bb "entry")
                (kind entry)
                (ub-assumptions)
                (value-equivs)
                (mem-invariants)))
            (return
              (scalar-refines
                (width 32)
                (src (binop add 32 (flags 0 0 0 0) (binop add 32 (flags 0 0 0 0) (var "%x" 32) (bv 32 0)) (bv 32 42)))
                (tgt (binop add 32 (flags 0 0 0 0) (var "%x" 32) (bv 32 42)))
                (smt-verified true))))
          EOF

          # 1. Valid equivalence + valid --check-merge MUST succeed (exit 0)
          "$VBIN" --src "$WORKDIR/src.ll" --tgt "$WORKDIR/tgt_ok.ll" --cert "$WORKDIR/cert_ok.cert"
          "$VBIN" --check-merge --orig "$WORKDIR/src.ll" --merged "$WORKDIR/tgt_ok.ll" --slice smoke_fold "$WORKDIR/src.ll" "$WORKDIR/tgt_ok.ll"

          # 2. Forged wrong-constant miscompilation MUST fail closed (exit != 0)
          sed 's/42/43/' "$WORKDIR/tgt_ok.ll" > "$WORKDIR/tgt_bad_const.ll"
          if "$VBIN" --src "$WORKDIR/src.ll" --tgt "$WORKDIR/tgt_bad_const.ll" --cert "$WORKDIR/cert_ok.cert"; then
            echo "FAIL: cert-validator accepted miscompiled constant!" >&2
            exit 1
          fi

          # 3. Forged target-invented nsw poison injection MUST fail closed (exit != 0)
          sed 's/add i32/add nsw i32/' "$WORKDIR/tgt_ok.ll" > "$WORKDIR/tgt_bad_nsw.ll"
          if "$VBIN" --src "$WORKDIR/src.ll" --tgt "$WORKDIR/tgt_bad_nsw.ll" --cert "$WORKDIR/cert_ok.cert"; then
            echo "FAIL: cert-validator accepted target-invented nsw!" >&2
            exit 1
          fi

          # 4. Forged prototype attribute smuggling in --check-merge (F-19) MUST fail closed
          cat > "$WORKDIR/merged_smuggled_attr.ll" <<'EOF'
          define i32 @smoke_fold(i32 noundef %x) {
          entry:
            %res = add i32 %x, 42
            ret i32 %res
          }
          EOF
          if "$VBIN" --check-merge --orig "$WORKDIR/src.ll" --merged "$WORKDIR/merged_smuggled_attr.ll" --slice smoke_fold "$WORKDIR/src.ll" "$WORKDIR/tgt_ok.ll"; then
            echo "FAIL: cert-validator --check-merge accepted smuggled noundef prototype!" >&2
            exit 1
          fi

      - name: Persist compiled Rocq 9.1 & Vellvm opam dependencies (even if downstream fails)
        if: always() && steps.opam-deps-cache.outputs.cache-hit != 'true' && hashFiles('_opam/bin/rocq') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _opam
          key: ${{ steps.opam-deps-cache.outputs.cache-primary-key }}
