name: Rocq 9.1 Formal Verification & Extraction CI

on:
  workflow_dispatch:
  push:
    tags:
      - "phase-*"
      - "toolchain-*"
      - "v*"
  pull_request:
    paths:
      - "vellvm/src/**"
      - "vellvm/rocq-vellvm.opam"
      - "passes/**"
      - "validator/**"
      - "scripts/run_forged_cert_suite.py"
      - "scripts/run_forged_mc_suite.py"
      - "scripts/run_isa_oracle_suite.py"
      - "scripts/isa_oracle/**"
      - "scripts/run_cert_mutation_suite.py"
      - ".github/workflows/rocq-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DUNE_CACHE: enabled
  DUNE_CACHE_STORAGE_MODE: copy
  OCAMLRUNPARAM: "s=2M,o=80"

jobs:
  rocq-verify:
    name: Build Vellvm Proofs & OCaml Extraction (Rocq 9.1)
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run static zero-Admitted & OCaml TCB gate first
        run: python3 scripts/verify_repo_integrity.py

      - name: Set up OCaml 4.14 base switch (without slow workspace rsync)
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "4.14.x"
          opam-pin: false
          opam-repositories: |
            rocq-released: https://rocq-prover.org/opam/released
            default: https://opam.ocaml.org

      - name: Restore compiled Rocq 9.1 & Vellvm opam dependencies
        id: opam-deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _opam
          key: rocq91-opam-${{ runner.os }}-4.14-${{ hashFiles('vellvm/rocq-vellvm.opam') }}

      - name: Install Rocq 9.1 & Vellvm dependencies (skipped on cache hit)
        run: |
          if [ ! -x "_opam/bin/rocq" ]; then
            opam install -y --deps-only ./vellvm/rocq-vellvm.opam -j$(nproc)
          fi

      - name: Cache Dune content-addressed build store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dune
          key: vellvm-dune-${{ runner.os }}-${{ hashFiles('vellvm/src/ml/**') }}
          restore-keys: |
            vellvm-dune-${{ runner.os }}-

      - name: Restore compiled Vellvm core .vo proof objects
        id: vellvm-core-vo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vellvm/src/rocq
          key: vellvm-core-vo-${{ runner.os }}-${{ hashFiles('vellvm/rocq-vellvm.opam', 'vellvm/src/_RocqProject', 'vellvm/src/rocq/**/*.v') }}

      - name: Restore compiled CertPasses .vo proof objects
        id: vellvm-passes-vo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: passes
          key: vellvm-passes-vo-${{ runner.os }}-${{ hashFiles('vellvm/rocq-vellvm.opam', 'vellvm/src/_RocqProject', 'vellvm/src/rocq/**/*.v', 'passes/**/*.v') }}

      - name: Restore compiled CertValidator .vo & extracted OCaml objects
        id: vellvm-validator-vo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            validator
            vellvm/src/ml/extracted
          key: vellvm-validator-vo-${{ runner.os }}-${{ hashFiles('vellvm/rocq-vellvm.opam', 'vellvm/src/_RocqProject', 'vellvm/src/rocq/**/*.v', 'passes/**/*.v', 'validator/**/*.v', 'vellvm/src/ml/extracted/Extract.v') }}

      - name: Compile Rocq 9.1 theories, extract OCaml & build libvellvm
        run: |
          run_mem_guarded() {
            local rc=0
            if command -v systemd-run >/dev/null 2>&1 && [ -d /run/systemd/system ] && sudo -n true >/dev/null 2>&1; then
              local run_user run_group
              run_user="$(id -un)"
              run_group="$(id -gn)"
              sudo systemd-run --scope --quiet \
                -p MemoryHigh=11G -p MemoryMax=12500M -p MemorySwapMax=2G -- \
                sudo -u "$run_user" -g "$run_group" \
                env PATH="$PATH" HOME="$HOME" OPAMROOT="${OPAMROOT:-$HOME/.opam}" \
                    OCAMLRUNPARAM="$OCAMLRUNPARAM" \
                    DUNE_CACHE="$DUNE_CACHE" DUNE_CACHE_STORAGE_MODE="$DUNE_CACHE_STORAGE_MODE" \
                "$@" || rc=$?
            else
              (ulimit -v 13107200 && exec "$@") || rc=$?
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error::Build command exited with code $rc (isolated 12.5G memory scope kept runner alive)"
              sudo -n dmesg -T 2>/dev/null | grep -i -E 'oom|killed process|memory cgroup' | tail -n 10 || true
              return "$rc"
            fi
          }
          REAL_ROCQ="$(opam exec -- which rocq)"
          mkdir -p /tmp/rocq-bin
          printf '#!/usr/bin/env bash\nif [ "${1:-}" = "compile" ]; then exec timeout --foreground -s INT -k 10s 240s "%s" "$@"; else exec "%s" "$@"; fi\n' "$REAL_ROCQ" "$REAL_ROCQ" > /tmp/rocq-bin/rocq
          chmod +x /tmp/rocq-bin/rocq
          echo "=== [1/3] Compiling Vellvm 3.0 Core & I2F Theories (-j2) ==="
          CORE_VOS=$(awk '/^\.\/rocq\/.*\.v$/ { sub(/^\.\//, ""); sub(/\.v$/, ".vo"); print }' vellvm/src/_RocqProject)
          run_mem_guarded opam exec -- make -C vellvm/src RocqMakefile
          run_mem_guarded opam exec -- env PATH="/tmp/rocq-bin:$PATH" make -C vellvm/src --no-print-directory -f RocqMakefile COQBIN="/tmp/rocq-bin/" ROCQBIN="/tmp/rocq-bin/" TIMED=1 -j2 $CORE_VOS
          free -h
          echo "=== [2/3] Compiling CertPasses & CertValidator Proofs (-k -j2) ==="
          run_mem_guarded opam exec -- env PATH="/tmp/rocq-bin:$PATH" make -C vellvm/src --no-print-directory -f RocqMakefile COQBIN="/tmp/rocq-bin/" ROCQBIN="/tmp/rocq-bin/" TIMED=1 real-all -k -j2
          free -h
          echo "=== [3/3] Extracting Verified OCaml & Building Binaries (-j2) ==="
          run_mem_guarded opam exec -- make -C vellvm/src all -j2

      - name: Independent Rocq kernel proof-checker gate (rocq check)
        run: |
          cd vellvm/src
          if command -v systemd-run >/dev/null 2>&1 && [ -d /run/systemd/system ] && sudo -n true >/dev/null 2>&1; then
            sudo systemd-run --scope --quiet -p MemoryHigh=11G -p MemoryMax=12500M -p MemorySwapMax=2G -- \
              sudo -u "$(id -un)" -g "$(id -gn)" \
              env PATH="$PATH" HOME="$HOME" OPAMROOT="${OPAMROOT:-$HOME/.opam}" OCAMLRUNPARAM="$OCAMLRUNPARAM" \
              opam exec -- rocq check -o -R rocq Vellvm -Q ../../passes CertPasses -Q ../../validator CertValidator \
                Vellvm.Semantics.TopLevel Vellvm.Theory.Equational \
                CertValidator.common.Options CertValidator.common.Diag CertValidator.common.CoreTactics CertValidator.common.BvTactics CertValidator.common.IntBvTactics CertValidator.common.EouTactics CertPasses.common.ItreeTactics \
                CertPasses.Pipeline CertPasses.McfgExport \
                CertPasses.ModuleMerge CertValidator.CfgDag CertValidator.CertValidator CertValidator.Elf64Spec \
                CertValidator.McFrameMem CertValidator.McIsaCommon CertValidator.McFormat CertValidator.Rv64Sem CertValidator.A64CoreSem CertValidator.McOblDischarger CertValidator.McLoop CertValidator.McCall CertValidator.McValidator CertValidator.CheckAssumptions
          else
            (ulimit -v 13107200 && exec opam exec -- rocq check -o -R rocq Vellvm -Q ../../passes CertPasses -Q ../../validator CertValidator \
              Vellvm.Semantics.TopLevel Vellvm.Theory.Equational \
              CertValidator.common.Options CertValidator.common.Diag CertValidator.common.CoreTactics CertValidator.common.BvTactics CertValidator.common.IntBvTactics CertValidator.common.EouTactics CertPasses.common.ItreeTactics \
              CertPasses.Pipeline CertPasses.McfgExport \
              CertPasses.ModuleMerge CertValidator.CfgDag CertValidator.CertValidator CertValidator.Elf64Spec \
              CertValidator.McFrameMem CertValidator.McIsaCommon CertValidator.McFormat CertValidator.Rv64Sem CertValidator.A64CoreSem CertValidator.McOblDischarger CertValidator.McLoop CertValidator.McCall CertValidator.McValidator CertValidator.CheckAssumptions)
          fi

      - name: Layer-1 kernel Print Assumptions audit gate
        run: |
          PA_DIR="$(mktemp -d /tmp/pa-audit-XXXXXX)"
          trap 'rm -rf "$PA_DIR"' EXIT
          cat > "$PA_DIR/audit.v" <<EOF
          Set Printing Width 10000.
          From Vellvm Require Theory.I2F.I2F_toplevel.
          From CertPasses Require Pipeline ModuleMerge.
          From CertValidator Require CertFormat AigLrat AlgRules CertValidator Elf64Spec McFormat Rv64Sem A64CoreSem McLoop McCall McValidator.
          Redirect "$PA_DIR/vellvm_i2f" Print Assumptions Vellvm.Theory.I2F.I2F_toplevel.model_refine.
          Redirect "$PA_DIR/pipeline" Print Assumptions CertPasses.Pipeline.optimize_mcfg_I2F_model_refine.
          Redirect "$PA_DIR/merge_i2f" Print Assumptions CertPasses.ModuleMerge.validate_module_merge_parsed_I2F_model_refine.
          Redirect "$PA_DIR/merge_tle" Print Assumptions CertPasses.ModuleMerge.validate_module_merge_tle_refines.
          Redirect "$PA_DIR/merge_cert" Print Assumptions CertPasses.ModuleMerge.validate_module_merge_certified_tle_refines.
          Redirect "$PA_DIR/aig_lrat" Print Assumptions CertValidator.AigLrat.check_lrat_unsat_sound.
          Redirect "$PA_DIR/dimacs_lrat" Print Assumptions CertValidator.CertFormat.validate_dimacs_lrat_str_sound.
          Redirect "$PA_DIR/elf64_extract" Print Assumptions CertValidator.Elf64Spec.elf64_extract_func_sound.
          Redirect "$PA_DIR/elf64_extract_calls" Print Assumptions CertValidator.Elf64Spec.elf64_extract_func_with_calls_sound.
          Redirect "$PA_DIR/mc_format_wf" Print Assumptions CertValidator.McFormat.parse_mc_cert_wf.
          Redirect "$PA_DIR/rv64_dag_wf" Print Assumptions CertValidator.Rv64Sem.summarize_rv64_dag_wf.
          Redirect "$PA_DIR/a64_dag_wf" Print Assumptions CertValidator.A64CoreSem.summarize_a64_dag_wf.
          Redirect "$PA_DIR/alg_rules" Print Assumptions CertValidator.AlgRules.check_expr_refines_with_lrat_sound.
          Redirect "$PA_DIR/cert_val" Print Assumptions CertValidator.CertValidator.validate_tle_pair_with_cert_str_sound.
          Redirect "$PA_DIR/rv64_dag_sound" Print Assumptions CertValidator.Rv64Sem.summarize_rv64_dag_sound.
          Redirect "$PA_DIR/a64_dag_sound" Print Assumptions CertValidator.A64CoreSem.summarize_a64_dag_sound.
          Redirect "$PA_DIR/rv64_sym_oracle" Print Assumptions CertValidator.Rv64Sem.rv_step_sym_oracle_sound.
          Redirect "$PA_DIR/a64_sym_oracle" Print Assumptions CertValidator.A64CoreSem.a64_step_sym_oracle_sound.
          Redirect "$PA_DIR/sail_divrem_bridge" Print Assumptions CertValidator.Rv64Sem.sail_divrem_128_width_reduce.
          Redirect "$PA_DIR/mc_loop_rv64" Print Assumptions CertValidator.McLoop.validate_mc_loop_rv64_sound.
          Redirect "$PA_DIR/mc_loop_a64" Print Assumptions CertValidator.McLoop.validate_mc_loop_a64_sound.
          Redirect "$PA_DIR/mc_call_rv64" Print Assumptions CertValidator.McCall.validate_mc_call_rv64_sound.
          Redirect "$PA_DIR/mc_call_a64" Print Assumptions CertValidator.McCall.validate_mc_call_a64_sound.
          Redirect "$PA_DIR/mc_compose_rv64" Print Assumptions CertValidator.McCall.compose_rv64_caller_callee_sound.
          Redirect "$PA_DIR/mc_compose_a64" Print Assumptions CertValidator.McCall.compose_a64_caller_callee_sound.
          Redirect "$PA_DIR/mc_val" Print Assumptions CertValidator.McValidator.validate_mc_tle_with_cert_str_sound.
          EOF
          (cd vellvm/src && opam exec -- rocq top -q -w none -R rocq Vellvm -Q ../../passes CertPasses -Q ../../validator CertValidator -batch -load-vernac-source "$PA_DIR/audit.v")
          python3 - "$PA_DIR" <<'PY'
          import pathlib, sys

          pa_dir = pathlib.Path(sys.argv[1])

          def parse_axioms(name: str) -> set[str]:
              txt = (pa_dir / f"{name}.out").read_text(encoding="utf-8")
              print(f"=== {name} ===\n{txt.strip()}")
              lines = [ln.strip() for ln in txt.splitlines() if ln.strip()]
              if lines == ["Closed under the global context"]:
                  return set()
              if not lines or lines[0] != "Axioms:":
                  print(f"Unexpected Print Assumptions header in {name}: {lines}", file=sys.stderr)
                  sys.exit(1)
              axs: set[str] = set()
              for raw in txt.splitlines()[1:]:
                  if not raw.strip() or raw.startswith(" "):
                      continue
                  axs.add(raw.split(":", 1)[0].strip())
              return axs

          approved_vellvm3_classical = {
              "ClassicalDedekindReals.sig_not_dec",
              "ClassicalDedekindReals.sig_forall_dec",
              "FunctionalExtensionality.functional_extensionality_dep",
              "Eqdep.Eq_rect_eq.eq_rect_eq",
              "Classical_Prop.classic",
          }
          vellvm_base = parse_axioms("vellvm_i2f")
          if not vellvm_base.issubset(approved_vellvm3_classical):
              print(f"Unexpected upstream Vellvm 3.0 axioms: {sorted(vellvm_base - approved_vellvm3_classical)}", file=sys.stderr)
              sys.exit(1)

          for zero_ax in ("aig_lrat", "dimacs_lrat", "elf64_extract", "elf64_extract_calls", "mc_format_wf", "rv64_dag_wf", "a64_dag_wf", "sail_divrem_bridge"):
              axs = parse_axioms(zero_ax)
              if axs:
                  print(f"{zero_ax} must be 100% axiom-free, got: {sorted(axs)}", file=sys.stderr)
                  sys.exit(1)

          for validator_thm in ("alg_rules", "cert_val", "rv64_dag_sound", "a64_dag_sound", "rv64_sym_oracle", "a64_sym_oracle", "mc_loop_rv64", "mc_loop_a64", "mc_call_rv64", "mc_call_a64", "mc_compose_rv64", "mc_compose_a64", "mc_val"):
              axs = parse_axioms(validator_thm)
              extra = axs - (vellvm_base - {"Eqdep.Eq_rect_eq.eq_rect_eq"})
              if extra:
                  print(f"Unapproved axiom in {validator_thm}: {sorted(extra)}", file=sys.stderr)
                  sys.exit(1)

          for pass_thm in ("pipeline", "merge_i2f", "merge_tle", "merge_cert"):
              axs = parse_axioms(pass_thm)
              extra = axs - vellvm_base
              if extra:
                  print(f"CertPasses theorem {pass_thm} introduced axiom(s) beyond upstream Vellvm 3.0: {sorted(extra)}", file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Smoke-test standalone verified-opt-fallback binary
        run: |
          BIN="vellvm/src/_build/default/ml/bin/verified-opt-fallback"
          test -x "$BIN"
          TMP_IN="$(mktemp /tmp/fallback-in-XXXXXX.ll)"
          TMP_OUT="$(mktemp /tmp/fallback-out-XXXXXX.ll)"
          cat > "$TMP_IN" <<'EOF'
          define i32 @smoke_add(i32 %x) {
          entry:
            %slot = alloca i32, align 4
            store i32 %x, ptr %slot, align 4
            %v = load i32, ptr %slot, align 4
            %dead = add i32 %v, 0
            %res = add i32 %v, 42
            ret i32 %res
          }
          EOF
          "$BIN" --pass pipeline -o "$TMP_OUT" "$TMP_IN"
          grep -q "define i32 @smoke_add" "$TMP_OUT"
          rm -f "$TMP_IN" "$TMP_OUT"

      - name: Install QEMU user-mode & CaDiCaL SAT/LRAT solver for ISA oracle and MC suites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user cadical

      - name: Layer-2 positive & adversarial forged-certificate gate on cert-validator
        run: |
          python3 scripts/run_forged_cert_suite.py \
            vellvm/src/_build/default/ml/bin/cert-validator \
            vellvm/src/_build/default/ml/bin/verified-opt-fallback
          python3 scripts/run_forged_mc_suite.py \
            vellvm/src/_build/default/ml/bin/cert-validator \
            vellvm/src/_build/default/ml/bin/cert-validator.bc

      - name: Stage-1 Dual-Arch Extracted Rocq ISA Semantics Differential Oracle (vs QEMU)
        run: |
          opam exec -- python3 -u scripts/run_isa_oracle_suite.py

      - name: Dual-compiler (ocamlopt vs. ocamlc) & certificate mutation assurance gate
        run: |
          python3 scripts/run_cert_mutation_suite.py \
            vellvm/src/_build/default/ml/bin/cert-validator \
            vellvm/src/_build/default/ml/bin/cert-validator.bc \
            vellvm/src/_build/default/ml/bin/verified-opt-fallback \
            vellvm/src/_build/default/ml/bin/verified-opt-fallback.bc

      - name: Standalone --check-lrat & Stage-3 (lrat ...) dual-compiler gate
        run: |
          python3 - \
            vellvm/src/_build/default/ml/bin/cert-validator \
            vellvm/src/_build/default/ml/bin/cert-validator.bc <<'PY'
          import hashlib, pathlib, subprocess, sys, tempfile

          bins = [sys.argv[1], sys.argv[2]]
          cnf_ok = "c D-01 unsat sanity\np cnf 2 4\n1 2 0\n1 -2 0\n-1 2 0\n-1 -2 0\n"
          lrat_ok = "5 1 0 1 2 0\n5 d 1 2 0\n6 -1 0 3 4 0\n7 0 5 6 0\n"
          neg_cases = [
              ("missing_empty", cnf_ok, "5 1 0 1 2 0\n"),
              ("bad_hint", cnf_ok, "5 1 0 1 3 0\n6 -1 0 3 4 0\n7 0 5 6 0\n"),
              ("sat_cnf", "p cnf 2 3\n1 2 0\n1 -2 0\n-1 2 0\n", lrat_ok),
              ("zero_lit", "p cnf 1 2\n1 0 0\n-1 0\n", lrat_ok),
              ("var_oob", "p cnf 1 2\n2 0\n-1 0\n", lrat_ok),
              ("neg_rat_hint", cnf_ok, "5 1 0 1 -2 0\n7 0 5 0\n"),
              ("bad_clause_count", "p cnf 2 3\n1 2 0\n1 -2 0\n-1 2 0\n-1 -2 0\n", lrat_ok),
          ]
          src_ll = "define i32 @id_add0(i32 noundef %x) {\nentry:\n  %r = add i32 %x, 0\n  ret i32 %r\n}\n"
          tgt_ll = "define i32 @id_add0(i32 noundef %x) {\nentry:\n  ret i32 %x\n}\n"
          sh = hashlib.sha256(src_ll.encode()).hexdigest()
          th = hashlib.sha256(tgt_ll.encode()).hexdigest()
          cert_tpl = (
              '(cert-v1\n  (fn "id_add0")\n  (src-sha256 ' + sh + ')\n  (tgt-sha256 ' + th + ')\n'
              '  (blocks (block (src-bb "entry") (tgt-bb "entry") (kind entry)\n'
              '    (ub-assumptions (param-noundef "%x" 32)) (value-equivs) (mem-invariants)))\n'
              '  (return (scalar-refines (width 32) (src (binop add 32 (flags 0 0 0 0) (var "%x" 32) (bv 32 0))) (tgt (var "%x" 32)) (smt-verified false)))\n'
              '  {extra})\n'
          )
          with tempfile.TemporaryDirectory() as td:
              p = pathlib.Path(td)
              (p / "ok.cnf").write_text(cnf_ok, encoding="utf-8")
              (p / "ok.lrat").write_text(lrat_ok, encoding="utf-8")
              (p / "src.ll").write_text(src_ll, encoding="utf-8")
              (p / "tgt.ll").write_text(tgt_ll, encoding="utf-8")
              (p / "ok.cert").write_text(cert_tpl.format(extra="(lrat (add 1 (1) (1)) (del (1)))"), encoding="utf-8")
              (p / "bad_empty_lrat.cert").write_text(cert_tpl.format(extra="(lrat)"), encoding="utf-8")
              (p / "bad_step_lrat.cert").write_text(cert_tpl.format(extra="(lrat (add 0 () ()))"), encoding="utf-8")
              for vb in bins:
                  r = subprocess.run([vb, "--check-lrat", "--cnf", str(p / "ok.cnf"), "--lrat", str(p / "ok.lrat")], capture_output=True, text=True)
                  assert r.returncode == 0, f"{vb} ok --check-lrat rc={r.returncode}: {r.stderr}"
                  for name, c_txt, l_txt in neg_cases:
                      (p / "n.cnf").write_text(c_txt, encoding="utf-8")
                      (p / "n.lrat").write_text(l_txt, encoding="utf-8")
                      rn = subprocess.run([vb, "--check-lrat", "--cnf", str(p / "n.cnf"), "--lrat", str(p / "n.lrat")], capture_output=True, text=True)
                      assert rn.returncode == 4, f"{vb} {name} expected rc=4, got {rn.returncode}: {rn.stderr}"
                  rs = subprocess.run([vb, "--src", str(p / "src.ll"), "--tgt", str(p / "tgt.ll"), "--cert", str(p / "ok.cert")], capture_output=True, text=True)
                  assert rs.returncode == 0, f"{vb} Stage3 lrat ok rc={rs.returncode}: {rs.stderr}"
                  for bad_c in ("bad_empty_lrat.cert", "bad_step_lrat.cert"):
                      rb = subprocess.run([vb, "--src", str(p / "src.ll"), "--tgt", str(p / "tgt.ll"), "--cert", str(p / bad_c)], capture_output=True, text=True)
                      assert rb.returncode == 4, f"{vb} {bad_c} expected rc=4, got {rb.returncode}: {rb.stderr}"
          print("Standalone --check-lrat & Stage-3 (lrat ...) dual-compiler gate OK.")
          PY

      - name: Package & upload verified Rocq/OCaml validator & fallback binaries
        run: |
          STAGE_DIR="dist/llvm-cert-rocq-tools-linux-x86_64"
          mkdir -p "$STAGE_DIR/bin"
          for bin in cert-validator cert-validator.bc verified-opt-fallback verified-opt-fallback.bc; do
            cp -a "vellvm/src/_build/default/ml/bin/$bin" "$STAGE_DIR/bin/$bin"
          done
          cp LICENSE "$STAGE_DIR/LICENSE"
          {
            echo "git_commit=$(git rev-parse HEAD)"
            echo "rocq=$(opam exec -- rocq --version | tr '\n' ' ')"
            echo "ocamlopt=$(opam exec -- ocamlopt -version)"
            echo "ocamlc=$(opam exec -- ocamlc -version)"
            echo "dune=$(opam exec -- dune --version)"
          } > "$STAGE_DIR/TOOLCHAIN.txt"
          (cd "$STAGE_DIR" && sha256sum bin/* LICENSE TOOLCHAIN.txt > SHA256SUMS.txt)
          tar -C dist -I 'zstd -19 -T0' -cf llvm-cert-rocq-tools-linux-x86_64.tar.zst llvm-cert-rocq-tools-linux-x86_64

      - name: Upload verified Rocq/OCaml validator & fallback artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llvm-cert-rocq-tools-linux-x86_64
          path: llvm-cert-rocq-tools-linux-x86_64.tar.zst
          retention-days: 90

      - name: Persist compiled Vellvm core .vo proof objects (even if downstream fails)
        if: always() && steps.vellvm-core-vo-cache.outputs.cache-hit != 'true' && hashFiles('vellvm/src/rocq/Theory/I2F/I2F_toplevel.vo') != '' && hashFiles('vellvm/src/rocq/Theory/Equational.vo') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vellvm/src/rocq
