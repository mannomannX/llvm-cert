name: Rocq 9.1 Formal Verification & Extraction CI

on:
  workflow_dispatch:
  push:
    tags:
      - "phase-*"
      - "toolchain-*"
      - "v*"
  pull_request:
    paths:
      - "vellvm/src/**"
      - "vellvm/rocq-vellvm.opam"
      - "passes/**"
      - "validator/**"
      - "scripts/run_forged_cert_suite.py"
      - ".github/workflows/rocq-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DUNE_CACHE: enabled
  DUNE_CACHE_STORAGE_MODE: copy
  OCAMLRUNPARAM: "s=2M,o=80"

jobs:
  rocq-verify:
    name: Build Vellvm Proofs & OCaml Extraction (Rocq 9.1)
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run static zero-Admitted & OCaml TCB gate first
        run: python3 scripts/verify_repo_integrity.py

      - name: Set up OCaml 4.14 base switch (without slow workspace rsync)
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "4.14.x"
          opam-pin: false
          opam-repositories: |
            rocq-released: https://rocq-prover.org/opam/released
            default: https://opam.ocaml.org

      - name: Restore compiled Rocq 9.1 & Vellvm opam dependencies
        id: opam-deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _opam
          key: rocq91-opam-${{ runner.os }}-4.14-${{ hashFiles('vellvm/rocq-vellvm.opam') }}

      - name: Install Rocq 9.1 & Vellvm dependencies (skipped on cache hit)
        run: |
          if [ ! -x "_opam/bin/rocq" ]; then
            opam install -y --deps-only ./vellvm/rocq-vellvm.opam -j$(nproc)
          fi

      - name: Cache Dune content-addressed build store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dune
          key: vellvm-dune-${{ runner.os }}-${{ hashFiles('vellvm/src/ml/**') }}
          restore-keys: |
            vellvm-dune-${{ runner.os }}-

      - name: Restore compiled Vellvm core .vo proof objects
        id: vellvm-core-vo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vellvm/src/rocq
          key: vellvm-core-vo-${{ runner.os }}-${{ hashFiles('vellvm/rocq-vellvm.opam', 'vellvm/src/_RocqProject', 'vellvm/src/rocq/**/*.v') }}

      - name: Restore compiled CertPasses .vo proof objects
        id: vellvm-passes-vo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: passes
          key: vellvm-passes-vo-${{ runner.os }}-${{ hashFiles('vellvm/rocq-vellvm.opam', 'vellvm/src/_RocqProject', 'vellvm/src/rocq/**/*.v', 'passes/**/*.v') }}

      - name: Restore compiled CertValidator .vo & extracted OCaml objects
        id: vellvm-validator-vo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            validator
            vellvm/src/ml/extracted
          key: vellvm-validator-vo-${{ runner.os }}-${{ hashFiles('vellvm/rocq-vellvm.opam', 'vellvm/src/_RocqProject', 'vellvm/src/rocq/**/*.v', 'passes/**/*.v', 'validator/**/*.v', 'vellvm/src/ml/extracted/Extract.v') }}

      - name: Compile Rocq 9.1 theories, extract OCaml & build libvellvm
        run: |
          echo "=== [1/3] Compiling Vellvm 3.0 Core & I2F Theories (-j2) ==="
          CORE_VOS=$(awk '/^\.\/rocq\/.*\.v$/ { sub(/^\.\//, ""); sub(/\.v$/, ".vo"); print }' vellvm/src/_RocqProject)
          opam exec -- make -C vellvm/src RocqMakefile
          opam exec -- make -C vellvm/src --no-print-directory -f RocqMakefile -j2 $CORE_VOS
          free -h
          echo "=== [2/3] Compiling CertPasses & CertValidator Proofs (-k -j2) ==="
          opam exec -- make -C vellvm/src --no-print-directory -f RocqMakefile real-all -k -j2
          free -h
          echo "=== [3/3] Extracting Verified OCaml & Building Binaries (-j2) ==="
          opam exec -- make -C vellvm/src all -j2

      - name: Independent Rocq kernel proof-checker gate (rocq check)
        run: cd vellvm/src && opam exec -- rocq check -o -R rocq Vellvm -R ../../passes CertPasses -R ../../validator CertValidator Vellvm.Semantics.TopLevel Vellvm.Theory.Equational CertPasses.Pipeline CertPasses.McfgExport CertPasses.ModuleMerge CertValidator.CertValidator CertValidator.CheckAssumptions

      - name: Layer-1 kernel Print Assumptions audit gate
        run: |
          OUT="$(cd vellvm/src && opam exec -- rocq top -q -R rocq Vellvm -R ../../passes CertPasses -R ../../validator CertValidator <<'EOF'
          Set Printing Width 10000.
          From CertPasses Require Pipeline ModuleMerge.
          From CertValidator Require AigLrat AlgRules CertValidator.
          Print Assumptions CertPasses.Pipeline.optimize_mcfg_I2F_model_refine.
          Print Assumptions CertPasses.ModuleMerge.validate_module_merge_parsed_I2F_model_refine.
          Print Assumptions CertPasses.ModuleMerge.validate_module_merge_tle_refines.
          Print Assumptions CertPasses.ModuleMerge.validate_module_merge_certified_tle_refines.
          Print Assumptions CertValidator.AigLrat.check_lrat_unsat_sound.
          Print Assumptions CertValidator.AlgRules.check_expr_refines_with_lrat_sound.
          Print Assumptions CertValidator.CertValidator.validate_tle_pair_with_cert_str_sound.
          EOF
          )"
          echo "$OUT"
          python3 - "$OUT" <<'PY'
          import sys
          out = sys.argv[1]
          allowed_markers = (
              "Closed under the global context",
          )
          for raw in out.splitlines():
              if not raw.strip() or raw.startswith(" "):
                  continue
              if not any(m in raw for m in allowed_markers):
                  print(f"Unapproved assumption in Print Assumptions output: {raw}", file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Smoke-test standalone verified-opt-fallback binary
        run: |
          BIN="vellvm/src/_build/default/ml/bin/verified-opt-fallback"
          test -x "$BIN"
          TMP_IN="$(mktemp /tmp/fallback-in-XXXXXX.ll)"
          TMP_OUT="$(mktemp /tmp/fallback-out-XXXXXX.ll)"
          cat > "$TMP_IN" <<'EOF'
          define i32 @smoke_add(i32 %x) {
          entry:
            %slot = alloca i32, align 4
            store i32 %x, ptr %slot, align 4
            %v = load i32, ptr %slot, align 4
            %dead = add i32 %v, 0
            %res = add i32 %v, 42
            ret i32 %res
          }
          EOF
          "$BIN" --pass pipeline -o "$TMP_OUT" "$TMP_IN"
          grep -q "define i32 @smoke_add" "$TMP_OUT"
          rm -f "$TMP_IN" "$TMP_OUT"

      - name: Layer-2 positive & adversarial forged-certificate gate on cert-validator
        run: |
          python3 scripts/run_forged_cert_suite.py \
            vellvm/src/_build/default/ml/bin/cert-validator \
            vellvm/src/_build/default/ml/bin/verified-opt-fallback

      - name: Persist compiled Vellvm core .vo proof objects (even if downstream fails)
        if: always() && steps.vellvm-core-vo-cache.outputs.cache-hit != 'true' && hashFiles('vellvm/src/rocq/Theory/I2F/I2F_toplevel.vo') != '' && hashFiles('vellvm/src/rocq/Theory/Equational.vo') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vellvm/src/rocq
          key: ${{ steps.vellvm-core-vo-cache.outputs.cache-primary-key }}

      - name: Persist compiled CertPasses .vo proof objects (even if validator fails)
        if: always() && steps.vellvm-passes-vo-cache.outputs.cache-hit != 'true' && hashFiles('passes/ModuleMerge.vo') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: passes
          key: ${{ steps.vellvm-passes-vo-cache.outputs.cache-primary-key }}

      - name: Persist compiled CertValidator .vo & extracted OCaml objects
        if: always() && steps.vellvm-validator-vo-cache.outputs.cache-hit != 'true' && hashFiles('validator/CheckAssumptions.vo') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            validator
            vellvm/src/ml/extracted
          key: ${{ steps.vellvm-validator-vo-cache.outputs.cache-primary-key }}

      - name: Persist compiled Rocq 9.1 & Vellvm opam dependencies (even if downstream fails)
        if: always() && steps.opam-deps-cache.outputs.cache-hit != 'true' && hashFiles('_opam/bin/rocq') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _opam
          key: ${{ steps.opam-deps-cache.outputs.cache-primary-key }}
