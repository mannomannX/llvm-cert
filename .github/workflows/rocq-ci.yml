name: Rocq 9.1 Formal Verification & Extraction CI

on:
  workflow_dispatch:
  push:
    tags:
      - "phase-*"
      - "toolchain-*"
      - "v*"
  pull_request:
    paths:
      - "vellvm/src/**"
      - "vellvm/rocq-vellvm.opam"
      - "passes/**"
      - "validator/**"
      - ".github/workflows/rocq-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DUNE_CACHE: enabled
  DUNE_CACHE_STORAGE_MODE: copy

jobs:
  rocq-verify:
    name: Build Vellvm Proofs & OCaml Extraction (Rocq 9.1)
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run static zero-Admitted & OCaml TCB gate first
        run: python3 scripts/verify_repo_integrity.py

      - name: Set up OCaml 4.14 base switch (without slow workspace rsync)
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "4.14.x"
          opam-pin: false
          opam-repositories: |
            rocq-released: https://rocq-prover.org/opam/released
            default: https://opam.ocaml.org

      - name: Restore compiled Rocq 9.1 & Vellvm opam dependencies
        id: opam-deps-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _opam
          key: rocq91-opam-${{ runner.os }}-4.14-${{ hashFiles('vellvm/rocq-vellvm.opam') }}

      - name: Install Rocq 9.1 & Vellvm dependencies (skipped on cache hit)
        run: |
          if [ ! -x "_opam/bin/rocq" ]; then
            opam install -y --deps-only ./vellvm/rocq-vellvm.opam -j$(nproc)
          fi

      - name: Cache Dune content-addressed build store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/dune
          key: vellvm-dune-${{ runner.os }}-${{ hashFiles('vellvm/src/ml/**') }}
          restore-keys: |
            vellvm-dune-${{ runner.os }}-

      - name: Cache compiled Vellvm .vo proof objects (exact hash key to preserve make mtimes)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vellvm/src/rocq
            vellvm/src/ml/extracted
          key: vellvm-vo-${{ runner.os }}-${{ hashFiles('vellvm/rocq-vellvm.opam', 'vellvm/src/_RocqProject', 'vellvm/src/rocq/**/*.v', 'vellvm/src/ml/extracted/Extract.v') }}

      - name: Compile Rocq 9.1 theories, extract OCaml & build libvellvm
        run: opam exec -- make -C vellvm/src all -j$(nproc)

      - name: Independent Rocq kernel proof-checker gate (rocq check)
        run: cd vellvm/src && opam exec -- rocq check -o -R rocq Vellvm Vellvm.Semantics.TopLevel Vellvm.Theory.Equational

      - name: Persist compiled Rocq 9.1 & Vellvm opam dependencies (even if downstream fails)
        if: always() && steps.opam-deps-cache.outputs.cache-hit != 'true' && hashFiles('_opam/bin/rocq') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _opam
          key: ${{ steps.opam-deps-cache.outputs.cache-primary-key }}
